<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel 3 Kolom 6 Baris</title>
    <style>
        /* CSS sederhana untuk merapikan tampilan tabel */
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        /* Memberikan warna selang-seling pada baris */
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        /* Efek hover saat kursor mengarah ke baris */
        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Tabel Contoh (3 Kolom x 6 Baris)</h2>

    <table>
        <thead>
            <!-- Baris ke-1 (Header / Judul Kolom) -->
            <tr>
                <th>nama</th>
                <th>jumlah</th>
                <th>harga</th>
            </tr>
        </thead>
        <tbody>
            <!-- Baris ke-2 -->
            <tr>
                <td>Data 1.1</td>
                <td>Data 1.2</td>
                <td>Data 1.3</td>
            </tr>
            <!-- Baris ke-3 -->
            <tr>
                <td>Data 2.1</td>
                <td>Data 2.2</td>
                <td>Data 2.3</td>
            </tr>
            <!-- Baris ke-4 -->
            <tr>
                <td>Data 3.1</td>
                <td>Data 3.2</td>
                <td>Data 3.3</td>
            </tr>
            <!-- Baris ke-5 -->
            <tr>
                <td>Data 4.1</td>
                <td>Data 4.2</td>
                <td>Data 4.3</td>
            </tr>
            <!-- Baris ke-6 -->
            <tr>
                <td>Data 5.1</td>
                <td>Data 5.2</td>
                <td>Data 5.3</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
