
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* CSS sederhana untuk merapikan tampilan tabel */
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        /* Memberikan warna selang-seling pada baris */
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        /* Efek hover saat kursor mengarah ke baris */
        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
